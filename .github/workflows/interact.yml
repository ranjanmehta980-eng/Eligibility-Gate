name: Execute 52 Preprod Interactions
on:
  workflow_dispatch:

jobs:
  interact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies & apply WASM patch
        run: |
          cd preprod-deployment
          npm install
          npm install --no-save tsx
          node infra/scripts/patch-wallet-sdk.mjs

      - name: Compile Contract Bindings
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0
          cd preprod-deployment/contracts
          compact compile src/bboard.compact ./src/managed/bboard
          npm run build

      - name: Increase swap space to 10GB
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /swapfile_extra || true
          sudo fallocate -l 10G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=10240
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Execute 52 Zero-Knowledge Transactions
        run: |
          cd preprod-deployment/cli
          npx tsx src/launcher/execute-interactions.ts
        env:
          NODE_OPTIONS: "--max-old-space-size=8192 --expose-gc"
          WALLET_SEED: ${{ secrets.WALLET_SEED }}

      - name: Upload Interactions Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preprod-interactions
          path: |
            PREPROD_USERS.md
            preprod-deployment/cli/interactions.json

      - name: Commit & Push PREPROD_USERS.md to Main
        run: |
          git config --global user.name "ranjanmehta980-eng"
          git config --global user.email "ranjanmehta980@gmail.com"
          git add PREPROD_USERS.md
          git commit -m "docs: add 52 verified on-chain Preprod transaction receipts (PREPROD_USERS.md)" || echo "No changes to commit"
          git push origin main || true
