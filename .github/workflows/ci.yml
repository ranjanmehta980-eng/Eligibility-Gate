name: Midnight CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Compile Compact Circuit & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Midnight Compact Compiler CLI
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          compact update 0.31.1 || compact update 0.31.0
          compact --version

      - name: Compile Compact Smart Contract & Generate Circuits
        run: npm run compile:contract

      - name: Run Midnight Zero-Knowledge Contract Test Suite
        run: npm run test

      - name: Build Production Web Application
        run: npm run build
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: 'preprod'
